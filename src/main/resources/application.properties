spring.application.name=Academia

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3307/academia?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Necesario para que Thymeleaf pueda leer relaciones LAZY (alumno.matriculas, etc.) en las vistas.
spring.jpa.open-in-view=true

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false

# ---------- Subida de ficheros ----------
# Carpeta (relativa a donde se ejecuta la app) donde se guardan las imágenes subidas.
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

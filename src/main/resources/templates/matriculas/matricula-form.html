<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${matricula.id == null ? 'Nueva matrícula' : 'Editar matrícula'})}"></head>
<body>
<header th:replace="~{fragments/layout :: cabecera('matriculas')}"></header>

<main class="contenedor">
    <h1 th:text="${matricula.id == null ? 'Nueva matrícula' : 'Editar matrícula'}">Nueva matrícula</h1>

    <form class="formulario" th:action="@{/matriculas/guardar}" th:object="${matricula}" method="post" novalidate>
        <div th:replace="~{fragments/layout :: resumenErrores}"></div>

        <input type="hidden" th:field="*{id}">

        <div class="campo" th:classappend="${#fields.hasErrors('codigo')} ? 'con-error'">
            <label for="codigo">Código</label>
            <input type="text" id="codigo" th:field="*{codigo}" maxlength="9" placeholder="MAT-00001">
            <span class="ayuda">MAT- seguido de 5 números. No puede repetirse.</span>
            <span class="error-campo" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></span>
        </div>

        <div class="campo" th:classappend="${#fields.hasErrors('alumno.id')} ? 'con-error'">
            <label for="alumno">Alumno</label>
            <select id="alumno" th:field="*{alumno.id}">
                <option value="">Selecciona un alumno</option>
                <option th:each="a : ${alumnos}" th:value="${a.id}"
                        th:text="${a.nombreCompleto + ' (' + a.dni + ')'}">García López, Ana (12345678Z)</option>
            </select>
            <span class="error-campo" th:if="${#fields.hasErrors('alumno.id')}" th:errors="*{alumno.id}"></span>
            <span class="ayuda" th:if="${#lists.isEmpty(alumnos)}">No hay alumnos. <a th:href="@{/alumnos/nuevo}">Crea uno primero</a>.</span>
        </div>

        <div class="campo" th:classappend="${#fields.hasErrors('curso.id')} ? 'con-error'">
            <label for="curso">Curso</label>
            <select id="curso" th:field="*{curso.id}">
                <option value="">Selecciona un curso</option>
                <option th:each="c : ${cursos}" th:value="${c.id}" th:text="${c.nombre}">Inglés B2</option>
            </select>
            <span class="error-campo" th:if="${#fields.hasErrors('curso.id')}" th:errors="*{curso.id}"></span>
        </div>

        <div class="campo" th:classappend="${#fields.hasErrors('fechaMatricula')} ? 'con-error'">
            <label for="fechaMatricula">Fecha de matrícula</label>
            <input type="date" id="fechaMatricula" th:field="*{fechaMatricula}">
            <span class="error-campo" th:if="${#fields.hasErrors('fechaMatricula')}" th:errors="*{fechaMatricula}"></span>
        </div>

        <div class="campo" th:classappend="${#fields.hasErrors('estado')} ? 'con-error'">
            <label for="estado">Estado</label>
            <select id="estado" th:field="*{estado}">
                <option value="">Selecciona un estado</option>
                <option th:each="e : ${estados}" th:value="${e}" th:text="${e.etiqueta}">Activa</option>
            </select>
            <span class="error-campo" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></span>
        </div>

        <div class="botones">
            <button type="submit" class="btn btn-primario">Guardar matrícula</button>
            <a class="btn btn-secundario" th:href="@{/matriculas}">Cancelar</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>

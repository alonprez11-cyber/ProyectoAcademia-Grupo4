<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${examen.id == null ? 'Nuevo examen' : 'Editar examen'})}"></head>
<body>
<header th:replace="~{fragments/layout :: cabecera('examenes')}"></header>

<main class="contenedor">
    <h1 th:text="${examen.id == null ? 'Nuevo examen' : 'Editar examen'}">Nuevo examen</h1>

    <form class="formulario" th:action="@{/examenes/guardar}" th:object="${examen}" method="post" novalidate>
        <div th:replace="~{fragments/layout :: resumenErrores}"></div>

        <input type="hidden" th:field="*{id}">

        <div class="campo" th:classappend="${#fields.hasErrors('titulo')} ? 'con-error'">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" th:field="*{titulo}">
            <span class="error-campo" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></span>
        </div>

        <div class="campo" th:classappend="${#fields.hasErrors('curso.id')} ? 'con-error'">
            <label for="curso">Curso</label>
            <select id="curso" th:field="*{curso.id}">
                <option value="">Selecciona un curso</option>
                <option th:each="c : ${cursos}" th:value="${c.id}" th:text="${c.nombre}">Inglés B2</option>
            </select>
            <span class="error-campo" th:if="${#fields.hasErrors('curso.id')}" th:errors="*{curso.id}"></span>
            <span class="ayuda" th:if="${#lists.isEmpty(cursos)}">No hay cursos. <a th:href="@{/cursos/nuevo}">Crea uno primero</a>.</span>
        </div>

        <div class="campo" th:classappend="${#fields.hasErrors('fecha')} ? 'con-error'">
            <label for="fecha">Fecha del examen</label>
            <input type="date" id="fecha" th:field="*{fecha}">
            <span class="ayuda">Debe estar dentro de las fechas del curso.</span>
            <span class="error-campo" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></span>
        </div>

        <div class="campo" th:classappend="${#fields.hasErrors('notaMaxima')} ? 'con-error'">
            <label for="notaMaxima">Nota máxima</label>
            <input type="number" id="notaMaxima" th:field="*{notaMaxima}" step="0.01" min="0.01" max="10">
            <span class="error-campo" th:if="${#fields.hasErrors('notaMaxima')}" th:errors="*{notaMaxima}"></span>
        </div>

        <div class="campo" th:classappend="${#fields.hasErrors('porcentaje')} ? 'con-error'">
            <label for="porcentaje">Peso en la nota final (%)</label>
            <input type="number" id="porcentaje" th:field="*{porcentaje}" min="1" max="100">
            <span class="ayuda">Los exámenes de un mismo curso no pueden sumar más de 100 %.</span>
            <span class="error-campo" th:if="${#fields.hasErrors('porcentaje')}" th:errors="*{porcentaje}"></span>
        </div>

        <div class="botones">
            <button type="submit" class="btn btn-primario">Guardar examen</button>
            <a class="btn btn-secundario" th:href="@{/examenes}">Cancelar</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>
